# Every approval declaration in cerase-core's connector catalogue
# (agent-runtime/mcp-registry/catalog.yaml), copied verbatim without its comment
# lines. The Marketplace's seed catalogue carries the same blocks. Tests read
# this copy rather than the sibling checkout, so a declaration added there is
# copied here too, and ApprovalDeclarationTest must accept it.
entries:
- slug: google-workspace
  approval_display:
    sentences:
      uploadFile: Caricare un file sul tuo Drive
      addPermission: Condividere un file del tuo Drive con altre persone
      createGoogleDoc: Creare un documento Google nel tuo Drive
      updateGoogleDoc: Modificare un documento Google
      insertText: Inserire del testo in un documento Google
      copyFile: Copiare un file del tuo Drive
