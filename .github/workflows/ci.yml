name: CI

# Unit tests for the shared connector-descriptor schema package. Runs on
# every push to main, every PR, and every v* tag. The suite is pure PHP
# (validation rules + descriptor config) — no Laravel/Filament boot needed —
# so it is fast and deterministic. Filament is a runtime `require`, so
# composer install resolves the full Filament v5 tree (the Section builders
# reference it); intl matches Filament's requirement.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (php ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      # Full history: the comment check compares against the previous commit of
      # this push, which a shallow clone does not contain.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      # The three guard scripts below are cerase-core's, copied here by its
      # scripts/sync-tooling.sh. The pin is what makes the copy a copy: without
      # this step a copy edited here decides the push, and the divergence shows
      # only in cerase-core's local suite. It runs first, so no step runs a
      # script the pin has not vouched for.
      - name: Vendored tooling matches the sha it recorded
        run: sha256sum --check scripts/TOOLING.sha256 scripts/TOOLING.seal

      # M-DOCS-PARITY-ALL-REPOS-1 — no document may name a command, file or path
      # that does not exist. A parity check that lives in one repo's local suite
      # is a check for one repo, so the same script runs in every repo's CI.
      - name: Docs parity
        run: bash scripts/docs-parity.sh

      # No comment carries what git already holds — a past date, a ticket ID,
      # or markup in an inline comment. Scoped to this push's own commits, so
      # it never reds on a legacy file nobody touched.
      - name: Comment convention
        run: bash scripts/comment-check.sh --base "${COMMENT_CHECK_BASE}"
        env:
          COMMENT_CHECK_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}

      # A0 step 4 · G2 + G3 — no credential file in this checkout, no retired
      # credential name in use. Same script in every repo, synced from core by
      # `scripts/sync-tooling.sh` and pinned by `scripts/TOOLING.sha256`: a
      # secrets guard that lives in one repo guards one repo.
      - name: Secrets guard
        run: bash scripts/secrets-guard.sh

      # Every image this repo builds names its base by digest, and no build pipes
      # an installer into a shell. Same script in every repo, synced from core.
      - name: Image bases guard
        run: bash scripts/image-bases-guard.sh

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl
          tools: composer
          coverage: none

      - name: Install composer deps
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: PHPUnit
        run: vendor/bin/phpunit --colors=always

  # M-GITLEAKS-BASELINE-1 — this repo had no secret scanning, and it is the one
  # whose entire subject is cloud credentials. It was the same pair as the
  # Dependabot gap recorded in the workspace CLAUDE.md: repos created days after
  # the others, silently not inheriting what the older ones had. Twice makes it
  # a pattern, so the fix is the job here AND the checklist there.
  #
  # `detect` scans HISTORY, not the working tree: a secret committed and then
  # removed is still published. Acknowledged findings live in `.gitleaksignore`
  # by fingerprint, one commit each — never a relaxed rule.
  gitleaks:
    name: gitleaks (hard block)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      # core's install action, copied here by its sync-tooling: the release
      # download first, then the image of the same version on ghcr.io when
      # github.com is down, failing only when both do. This job runs the copy,
      # so this job checks it against its pin first.
      - name: Vendored tooling matches the sha it recorded
        run: sha256sum --check scripts/TOOLING.sha256 scripts/TOOLING.seal
      - name: Install gitleaks
        uses: ./.github/actions/install-gitleaks
        with:
          version: 8.21.2
      - name: Scan repository history
        run: gitleaks detect --source . --redact --verbose --exit-code 1
