name: CI

# Unit tests for the shared connector-descriptor schema package. Runs on
# every push to main, every PR, and every v* tag. The suite is pure PHP
# (validation rules + descriptor config) — no Laravel/Filament boot needed —
# so it is fast and deterministic. Filament is a runtime `require`, so
# composer install resolves the full Filament v5 tree (the Section builders
# reference it); intl matches Filament's requirement.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (php ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      # M-DOCS-PARITY-ALL-REPOS-1 — no document may name a command, file or path
      # that does not exist. A parity check that lives in one repo's local suite
      # is a check for one repo, so the same script runs in every repo's CI.
      - name: Docs parity
        run: bash scripts/docs-parity.sh

      # A0 step 4 · G2 + G3 — no credential file in this checkout, no retired
      # credential name in use. Same script in every repo, synced from core by
      # `scripts/sync-tooling.sh` and pinned by `scripts/TOOLING.sha256`: a
      # secrets guard that lives in one repo guards one repo.
      - name: Secrets guard
        run: bash scripts/secrets-guard.sh

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl
          tools: composer
          coverage: none

      - name: Install composer deps
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: PHPUnit
        run: vendor/bin/phpunit --colors=always

  # M-GITLEAKS-BASELINE-1 — this repo had no secret scanning, and it is the one
  # whose entire subject is cloud credentials. It was the same pair as the
  # Dependabot gap recorded in the workspace CLAUDE.md: repos created days after
  # the others, silently not inheriting what the older ones had. Twice makes it
  # a pattern, so the fix is the job here AND the checklist there.
  #
  # `detect` scans HISTORY, not the working tree: a secret committed and then
  # removed is still published. Acknowledged findings live in `.gitleaksignore`
  # by fingerprint, one commit each — never a relaxed rule.
  gitleaks:
    name: gitleaks (hard block)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.21.2
        run: |
          set -euo pipefail
          # ⚠️ `--retry`, because this step HARD-BLOCKS a merge and its input is
          # a third party's CDN. Measured 2026-08-12: a 503 from the release
          # host reddened a repo whose code was fine, and a security gate that
          # fails on somebody else's outage is a gate people learn to re-run
          # without reading. Retries on transient status too, not only on
          # connection errors — a 503 IS the case that happened.
          curl -fsSL --retry 5 --retry-delay 3 --retry-all-errors \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Scan repository history
        run: gitleaks detect --source . --redact --verbose --exit-code 1
